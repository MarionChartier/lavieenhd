                - generic [ref=f472e264]: The Place to be
            - blockquote [ref=f472e265]: "Je m'attendais à sortir le globe terrestre pour poser une petite gommette sur le lieu de vie idéal pour moi ! Mais ce que j'ai découvert, c'est bien plus que ça ! J'ai dévoré ce guide comme si je lisais le meilleur roman du moment ! Merci Marion pour la richesse de cet ebook, et pour tous ces détails et conseils pratiques : c'est pépite ! Les explications sont claires et précises, et on est vraiment guidés pas à pas pour décrypter notre environnement et appliquer des changements concrets dans notre quotidien. Encore merci Marion 🌟"
            - button "Lire la suite" [ref=f472e266]:
              - generic [ref=f472e267]: Lire la suite
              - generic [ref=f472e268]: ↓
