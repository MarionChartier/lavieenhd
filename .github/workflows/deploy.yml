# Deploys to Marion's Vercel project (Hobby plan): commits from collaborators are
# not deployed by the Git integration, so a deploy hook builds main instead.
# The hook URL is stored in the VERCEL_DEPLOY_HOOK repository secret.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
